name: Validar e compilar
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Testar estoque e cadastros
        run: node test-stock.mjs
      - name: Compilar aplicativo
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: almoxarifado-build
          path: dist/
          if-no-files-found: error
          retention-days: 7
